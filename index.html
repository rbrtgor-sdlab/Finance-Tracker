<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <h1><i class="fas fa-wallet"></i> Personal Finance Tracker</h1>
    <nav>
      <a href="./index.html">Dashboard</a>
      <a href="./addtransaction.html">Add Transaction</a>
      <a href="./transactionhistory.html">Transaction History</a>
      <button id="themeToggle" class="theme-toggle" type="button">
        Dark Mode
      </button>
    </nav>

    <div class="container">
      <h1>Dashboard</h1>

      <h2>Balance: KES <span id="balance">0</span></h2>

      <div class="summary">
        <div>
          <h3>Income</h3>
          <p id="income">0</p>
        </div>
        <div>
          <h3>Expenses</h3>
          <p id="expense">0</p>
        </div>
      </div>

      <div class="dashboard-widgets">
        <div class="goal-card">
          <h3>Savings Goal</h3>
          <div class="goal-info">
            <input
              type="number"
              id="goalInput"
              placeholder="Monthly goal"
              min="0"
            />
            <button id="saveGoalBtn" type="button">Save Goal</button>
          </div>
          <div class="goal-progress">
            <div class="goal-bar">
              <div id="goalBarFill"></div>
            </div>
            <p id="goalText">No goal set yet.</p>
          </div>
        </div>

        <div class="recent-card">
          <h3>Recent Activity</h3>
          <ul id="recentList" class="recent-list"></ul>
        </div>
      </div>

      <canvas id="chart"></canvas>
    </div>

    <div id="toast" class="toast-container"></div>
    <script src="./script.js" defer></script>
  </body>
</html>
